# Excubitor catalog 断片 — このリポジトリが所有するサービス定義。
# Excubitor が ${ARS_ROOT} 配下を走査して集積する (Excubitor/catalog/FRAGMENTS.md)。
#
# 中央 catalog/services.yaml の撤去 (Excubitor: require service-owned definitions) に伴い、
# 旧 catalog にあった定義をそのまま移設したもの。
services:
  - code: discutere
    name: Discutere (Discord 議論)
    domain: di${DOMAIN_ROOT}
    tier: saas
    project_code: discutere
    subdomain: di
    component: backend
    port: 3110
    repo: LUDIARS/Discutere
    runtime: node
    cwd: ${ARS_ROOT}/Discutere
    command: npm run dev:server
    allow_hot_reload: true
    # BACKEND_PORT=3110 は env: で spawn env に注入され、 npm → node が継承する
    # (Nuntius(3100) との port 競合回避)。
    autostart: false
    env:
      BACKEND_PORT: "3110"
      DATABASE_PATH: "data/discutere.db"
      # 同一端末配置。HTTP 認証は loopback に限定し、Tailnet HTTP へ秘密を送らない。
      # port 正本: Cernere / Voluptas の各 excubitor.catalog.yaml。
      CERNERE_BASE_URL: http://127.0.0.1:8080
      DISCUTERE_VOLUPTAS_BASE_URL: http://127.0.0.1:8892
      # 認証集約 P4: persona bridge が受ける Cernere service token の aud (= Discutere の storage_slug)。
      CERNERE_PROJECT_STORAGE_SLUG: "discutere"
    # 認証集約 P4: service token の検証 (公開鍵取得) と発行 (persona import の送り側) に使う。
    # この同居配置では上の loopback env を優先する。未設定でも起動は止めず、
    # service token だけが 503 になる (固定トークン経路は従来どおり)。
    requires_secret:
      - service: cernere
        keys: [EXCUBITOR_CERNERE_CLIENT_ID, EXCUBITOR_CERNERE_CLIENT_SECRET]
    cernere_launch_credentials:
      target_project: discutere
    health:
      type: http
      url: http://localhost:3110/health
      interval_sec: 30
    provides:
      DISCUTERE_URL: http://${host}:${port}

  # ─────────────── personal (本人 PC 専用ツール / tier: personal) ───────────────
  # 個人ローカル開発用 server (個人ログ専用、 port 5180)。 シェアサーバ (Hub) とは別。
