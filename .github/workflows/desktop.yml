name: Desktop (Windows exe)

# Windows 向けデスクトップアプリ (Electron) のパッケージビルド。docs/desktop-app.md 参照。
# 成果物: Discutere-Setup-*.exe (NSIS インストーラ) + Discutere-Portable-*.exe (単一 exe)。
# 配布 (パッケージビルド) は基礎挙動 (ci.yml) と無関係なので PR では走らせない。
# 手動 (workflow_dispatch) か タグ push (v*、議論データ管理ツール対応完了後の運用) のみ。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      # LUDIARS 依存 (llm-gateway/blackbox/canalis/vestigium/fundamentum) は lib/* submodule (全て public)。
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build submodule deps (lib/*)
        run: npm run setup:submodules -- --skip-git-update

      - name: Install deps
        run: npm ci

      # サーバ本体を dist/ にビルド (tsc + 資産コピー)。
      - name: Build server (tsc)
        run: npm run build

      # better-sqlite3 を Electron ABI 向けにリビルド (kuzu は N-API なのでそのまま動く)。
      - name: Rebuild native modules for Electron
        run: npm run app:rebuild

      - name: Package (electron-builder, NSIS + portable)
        run: npx electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discutere-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
