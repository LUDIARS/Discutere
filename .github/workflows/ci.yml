name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # HARNESS の決定的ルール (spec/ 構造・migration 冪等性・個人データ列) を CI ゲート化する。
  # 正本は AIFormat/.github/workflows/harness-checks.yml。同 org public なので GITHUB_TOKEN で足りる。
  harness:
    uses: LUDIARS/AIFormat/.github/workflows/harness-checks.yml@main

  build-test:
    runs-on: ubuntu-latest
    steps:
      # LUDIARS 依存 (llm-gateway/sentiment-core/canalis/fundamentum) は lib/* submodule (public)。
      # lib/lorica (C++ 版のビルド用、private) はこのジョブでは使わないので取得しない。
      - uses: actions/checkout@v4

      - name: Fetch submodules (TS 用)
        run: git submodule update --init --recursive --depth 1 lib/lapilli lib/canalis lib/vestigium lib/fundamentum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # checkout で submodule 取得済みなので --skip-git-update で二重取得を避ける。
      - name: Build submodule deps (lib/*)
        run: npm run setup:submodules -- --skip-git-update

      - name: Install deps
        run: npm ci

      - name: Check shared sentiment assets
        run: npm run check:sentiment-assets

      # 型チェック (tsc --noEmit) — build とは別ゲートで静的解析を明示
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # ビルドチェック (tsc)
      - name: Build (tsc)
        run: npm run build

      # 動作テスト: 自作 tsx ランナー (node:assert)。Discord/LLM を叩かない。
      # 常駐サーバは C++ 版 (native/) に移したので、ここで見るのは運用スクリプト (scripts/) と
      # サイドカー (native/sidecar) が使う TS だけ。
      - name: Tests (core)
        run: |
          npm run test:core
          npm run test:ft
          npm run test:phase3
          npm run test:phase4
          npm run test:kg-sync
          npm run test:conclusion-cache
      - name: Tests (crawler / visualize / persona / discord-hook / flow)
        run: |
          npm run test:crawler
          npm run test:comment-history
          npm run test:visualize
          npm run test:persona-engine
          npm run test:discord-hook
          npm run test:mechanics-check
          npm run test:level-check
          npm run test:backup
          npm run test:flow
          npm run test:fundamentum-export
          npm run test:vault-env
          npm run test:setup-links
