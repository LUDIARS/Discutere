name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # HARNESS の決定的ルール (spec/ 構造・migration 冪等性・個人データ列) を CI ゲート化する。
  # 正本は AIFormat/.github/workflows/harness-checks.yml。同 org public なので GITHUB_TOKEN で足りる。
  harness:
    uses: LUDIARS/AIFormat/.github/workflows/harness-checks.yml@main

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc の @ludiars scope (GitHub Packages) を読むため NODE_AUTH_TOKEN を渡す。
      # 組織内パッケージ @ludiars/canalis をビルトイン GITHUB_TOKEN (packages:read) で取得。
      - name: Install deps
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 型チェック (tsc --noEmit) — build とは別ゲートで静的解析を明示
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # ビルドチェック (tsc)
      - name: Build (tsc)
        run: npm run build

      # 動作テスト: 自作 tsx ランナー (node:assert)。Discord/LLM を叩かない
      # 純ロジック/投影/ブリッジ/仮説/クローラ/可視化/ペルソナ/discord-hook を網羅。
      - name: Tests (core + phases)
        run: |
          npm run test:core
          npm run test:phase2
          npm run test:phase3
          npm run test:phase4
          npm run test:phase5
          npm run test:phase6
      - name: Tests (crawler / visualize / persona / machina / discord-hook)
        run: |
          npm run test:crawler
          npm run test:visualize
          npm run test:persona-engine
          npm run test:machina
          npm run test:discord-hook
          npm run test:runtime-settings
          npm run test:startup-guard
          npm run test:flow
