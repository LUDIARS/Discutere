name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # HARNESS の決定的ルール (spec/ 構造・migration 冪等性・個人データ列) を CI ゲート化する。
  # 正本は AIFormat/.github/workflows/harness-checks.yml。同 org public なので GITHUB_TOKEN で足りる。
  harness:
    uses: LUDIARS/AIFormat/.github/workflows/harness-checks.yml@main

  build-test:
    runs-on: ubuntu-latest
    steps:
      # LUDIARS 依存 (llm-gateway/blackbox/canalis/vestigium/fundamentum) は lib/* submodule。
      # Fundamentum は private repo のため素の GITHUB_TOKEN では取得できない場合がある → org PAT フォールバック
      # (All-In-OneTest/.github/workflows/service-all.yml と同じ方式)。
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # checkout で submodule 取得済みなので --skip-git-update で二重取得を避ける。
      - name: Build submodule deps (lib/*)
        run: npm run setup:submodules -- --skip-git-update

      - name: Install deps
        run: npm ci

      # 型チェック (tsc --noEmit) — build とは別ゲートで静的解析を明示
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # ビルドチェック (tsc)
      - name: Build (tsc)
        run: npm run build

      # 動作テスト: 自作 tsx ランナー (node:assert)。Discord/LLM を叩かない
      # 純ロジック/投影/ブリッジ/仮説/クローラ/可視化/ペルソナ/discord-hook を網羅。
      - name: Tests (core + phases)
        run: |
          npm run test:core
          npm run test:phase2
          npm run test:phase3
          npm run test:phase4
          npm run test:phase5
          npm run test:phase6
      - name: Tests (crawler / visualize / persona / discord-hook)
        run: |
          npm run test:crawler
          npm run test:visualize
          npm run test:persona-engine
          npm run test:discord-hook
          npm run test:runtime-settings
          npm run test:startup-guard
          npm run test:flow
          npm run test:fundamentum-export
